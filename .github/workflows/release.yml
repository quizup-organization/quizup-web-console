name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'

jobs:
  release:
    uses: quizup-organization/quizup-reusable-workflows/.github/workflows/frontend-release.yml@main
    with:
      github-username: ${{ vars.QUIZUP_GITHUB_USERNAME }}
      # Image : ghcr.io/quizup-organization/quizup-web-console
      service-name: quizup-web-console
      # API admin servie sur la MÊME origine (Ingress : /api/console → quizup-console).
      vite-api-url: https://console.quizup.cnadjim.fr
      vite-oidc-authority: https://identity.quizup.cnadjim.fr
      vite-oidc-client-id: console
      vite-oidc-redirect-uri: https://console.quizup.cnadjim.fr/callback
    secrets:
      GITHUB_PASSWORD: ${{ secrets.QUIZUP_GITHUB_TOKEN }}
